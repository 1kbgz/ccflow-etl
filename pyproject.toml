[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "ccflow-etl"
authors = [
    {name = "1kbgz", email = "dev@1kbgz.com"},
]
description = "ETL Tools for ccflow"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "0.1.2"
requires-python = ">=3.10"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "ccflow>=0.8.5",
    "hydra-core",
    "pydantic",
    "pyarrow",
]

[project.entry-points."hydra.lernaplugins"]
ccflow-etl = "pkg:ccflow_etl.config"

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "codespell",
    "hatchling",
    "mdformat",
    "mdformat-tables>=1",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
    "uv",
    "wheel",
    # tests and extras
    "lerna",
]

[project.scripts]
cc-etl = "ccflow_etl.cli:main"
cc-etl-explain = "ccflow_etl.cli:explain"

[project.urls]
Repository = "https://github.com/1kbgz/ccflow-etl"
Homepage = "https://github.com/1kbgz/ccflow-etl"

[tool.bumpversion]
current_version = "0.1.2"
commit = true
tag = true
commit_args = "-s"

[[tool.bumpversion.files]]
filename = "ccflow_etl/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.coverage.run]
branch = true
omit = [
    "ccflow_etl/tests/integration/",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build]
artifacts = []

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.targets.sdist]
packages = [
    "ccflow_etl",
]

[tool.hatch.build.targets.wheel]
packages = [
    "ccflow_etl",
]

[tool.hatch.build.targets.wheel.shared-data]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "ccflow_etl/tests"
markers = [
    "integration: cross-package tests using only local synthetic fixtures",
    "e2e: complete local workflow tests using only synthetic fixtures and local storage",
    "live: tests requiring live provider credentials or external infrastructure",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "ccflow_etl",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]


[tool.yardang]
title = "ccflow-etl"
root = "README.md"
exclude-patterns = [
    ".github",
    ".github/*",
    ".github/**",
    "AGENTS.md",
    "README.md",
    "ROADMAP.md",
]
pages = [
    "docs/src/cli.md",
    "docs/src/pipelines.md",
    "docs/src/backfills.md",
    "docs/src/handoffs.md",
    "docs/src/development.md",
    "docs/src/api.md",
]
use-autoapi = false
autodoc-pydantic-field-list-validators = false
autodoc-pydantic-field-show-constraints = false
autodoc-pydantic-model-show-config-summary = false
autodoc-pydantic-model-show-field-summary = false
autodoc-pydantic-model-show-validator-members = false
autodoc-pydantic-model-show-validator-summary = false
autodoc-pydantic-settings-show-json = false
